<html>
    <head></head>
    <style>
    </style>
    <body>
        <h1>Bank To CSV</h1>
        
        <h4>Bank Normal</h4>
        <textarea type="text" id="input_search" value="" rows="10" cols="50"></textarea>
        <button id="btn_convert">Convert To CSV</button>

        <h4>Bank Line Breaks</h4>
        <textarea type="text" id="input_line_breaks" value="" rows="10" cols="50"></textarea>
        <button id="btn_convert_line_breaks">Convert To CSV</button>

        <h4>Credit Card Normal</h4>
        <textarea type="text" id="input_credit_card" value="" rows="10" cols="50"></textarea>
        <button id="btn_convert_credit_card">Convert To CSV</button>

        <div id="csv_output"></div>

        <table id="result">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Description</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="results">

            </tbody>    
        </table>

    </body>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
     <script>
        $(function() {
            // Code to run when the DOM is ready
            console.log("DOM is ready!");

            var searchButton = $('#btn_convert');

            var inputSearch = $('#input_search');

            var results = $('#results');

            searchButton.click(function() {
                console.log("search button clicked!");

                const lines = inputSearch.val().split('\n');
                
                lines.forEach(line => {
                    var date = line.substring(0, 5).trim();

                    console.log("Date " + date);

                    var lastSpace = line.lastIndexOf(" ");
                    var amount = line.substring(lastSpace, line.length).trim();
                    console.log("Amount " + amount);

                    var description = line.substring(5, lastSpace).trim();
                    console.log("Description " + description);

                    var type = "ATM Check Withdrawal";
                    if (line.includes("ATM Check Deposit")) {
                        type = "ATM Check Deposit";
                    } else if (line.includes("credit")) {
                        type = "credit";
                    }

                    console.log("Type " + type);

                    results.append(`
                        <tr>
                            <td>${date}</td>
                            <td>${type}</td>
                            <td>${description.replace('ATM Check Deposit', '')}</td>
                            <td>${amount}</td>
                        </tr>
                    `);
                });
            });

            var searchButtonBreak = $('#btn_convert_line_breaks');

            var inputSearchBreak = $('#input_line_breaks');

            searchButtonBreak.click(function() {
                console.log("search button clicked!");

                const line = inputSearchBreak.val().replace("\n", " ").replace("\r", " ");
                
                console.log(line);

                var date = line.substring(0, 5).trim();

                    console.log("Date " + date);

                    var lastSpace = line.lastIndexOf(" ");
                    var amount = line.substring(lastSpace, line.length).trim();
                    console.log("Amount " + amount);

                    var description = line.substring(5, lastSpace).trim();
                    console.log("Description " + description);

                    var type = "ATM Check Withdrawal";
                    if (line.includes("ATM Check Deposit")) {
                        type = "ATM Check Deposit";
                    } else if (line.includes("credit")) {
                        type = "credit";
                    }

                    console.log("Type " + type);

                    results.append(`
                        <tr>
                            <td>${date}</td>
                            <td>${type}</td>
                            <td>${description.replace('ATM Check Deposit', '')}</td>
                            <td>${amount}</td>
                        </tr>
                    `);
            });

            var searchButtonCredit = $('#btn_convert_credit_card');

            var inputSearchCredit = $('#input_credit_card');

            searchButtonCredit.click(function() {
                console.log("search button clicked!");

                const lines = inputSearchCredit.val().split('\n');
                
                lines.forEach(line => {
                    var date = line.substring(0, 5).trim();

                    console.log("Date " + date);

                    var lastSpace = line.lastIndexOf(" ");
                    var amount = line.substring(lastSpace, line.length).trim();
                    console.log("Amount " + amount);

                    var description = line.substring(5, lastSpace).trim();
                    console.log("Description " + description);

                    var type = "";
                    if (line.includes("ATM Check Deposit")) {
                        type = "ATM Check Deposit";
                    } else if (line.includes("credit")) {
                        type = "credit";
                    }

                    console.log("Type " + type);

                    results.append(`
                        <tr>
                            <td>${date}</td>
                            <td>${description.replace('ATM Check Deposit', '')}</td>
                            <td>${amount}</td>
                            <td>${type}</td>
                        </tr>
                    `);
                });

                console.log('Lines ' + lines.length);
            });
        });
    </script>
</html>
